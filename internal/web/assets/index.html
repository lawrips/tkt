<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TKT Web</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-main">
        <div class="topbar-brand">
          <span class="brand-name">TKT</span>
          <span class="brand-sep" aria-hidden="true">/</span>
          <span class="brand-context">Workbench</span>
        </div>
        <nav class="main-nav" aria-label="Workbench views">
          <button id="nav-tickets" class="nav-button" type="button" aria-current="page">Tickets</button>
          <button id="nav-health" class="nav-button" type="button">Health</button>
        </nav>
      </div>
      <div id="session-status" class="status-pill">Starting</div>
    </header>
    <main id="workspace" class="workspace view-tickets view-list">
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close projects" hidden></button>
      <aside id="sidebar" class="sidebar column-pane" aria-label="Projects">
        <div class="panel-header sidebar-header">
          <h2>Projects</h2>
          <div class="sidebar-actions">
            <button id="refresh-projects" class="icon-button sidebar-refresh" type="button" title="Refresh projects" aria-label="Refresh projects">↻</button>
            <button id="toggle-sidebar" class="icon-button sidebar-toggle" type="button" aria-expanded="true" title="Hide projects" aria-label="Hide projects">⊟</button>
          </div>
        </div>
        <div class="panel-scroll sidebar-body">
          <div id="setup-panel" class="setup-panel"></div>
          <nav id="project-list" class="project-list"></nav>
        </div>
      </aside>
      <div id="resize-sidebar" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize projects pane" tabindex="-1"></div>
      <section id="ticket-column" class="ticket-column column-pane" aria-label="Tickets">
        <div class="panel-header ticket-panel-header">
          <button id="open-sidebar" class="button-secondary project-drawer-button" type="button" hidden title="Open projects" aria-label="Open projects">Projects</button>
          <div>
            <h2 id="ticket-heading">Tickets</h2>
            <p id="ticket-count" class="muted">No project selected</p>
          </div>
        </div>
        <form id="filters" class="filters toolbar">
          <input id="search" type="search" placeholder="Search id or title" autocomplete="off" aria-label="Search tickets">
          <select id="status" aria-label="Filter by status">
            <option value="">All status</option>
            <option value="open">Open</option>
            <option value="in_progress">In progress</option>
            <option value="needs_testing">Needs testing</option>
            <option value="closed">Closed</option>
          </select>
          <select id="type" aria-label="Filter by type">
            <option value="">All type</option>
            <option value="bug">Bug</option>
            <option value="feature">Feature</option>
            <option value="task">Task</option>
            <option value="epic">Epic</option>
            <option value="chore">Chore</option>
          </select>
        </form>
        <div class="panel-scroll ticket-list-scroll">
          <div id="ticket-list" class="ticket-list"></div>
        </div>
      </section>
      <div id="resize-list" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize ticket list pane" tabindex="-1"></div>
      <section id="detail-column" class="detail-column column-pane" aria-label="Ticket detail">
        <div id="detail-toolbar" class="panel-header detail-toolbar" hidden>
          <button id="detail-back" class="back-button" type="button">Back</button>
        </div>
        <div class="panel-scroll">
          <div id="ticket-detail" class="ticket-detail empty-state">
            Select a ticket to view details.
          </div>
        </div>
      </section>
      <section id="health-column" class="health-column column-pane" aria-label="Setup health" hidden>
        <div class="panel-header">
          <div>
            <h2>Setup Health</h2>
            <p class="muted">Local doctor checks for this project</p>
          </div>
          <button id="refresh-health" class="icon-button" type="button" title="Refresh health" aria-label="Refresh health">↻</button>
        </div>
        <div class="panel-scroll">
          <div id="health-panel" class="health-panel"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/markdown.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
